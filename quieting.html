<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>It Gets Quieter</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    body {
      color: #e6e6e6;
      font-family: system-ui, sans-serif;
    }

    .container {
      max-width: 700px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h2 {
      margin-top: 120px;
      opacity: 0.8;
    }

    .thought {
      margin: 40px 0;
      opacity: 0.7;
      transition: 2s ease;
    }

    .slow {
      animation: slowFade 10s ease-in-out forwards;
    }

    @keyframes slowFade {
      0% {
        opacity: 0.8;
        transform: translateY(0px);
      }
      60% {
        opacity: 0.4;
      }
      100% {
        opacity: 0.1;
        transform: translateY(10px);
      }
    }

    .fade-out {
      position: relative;

      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,1) 40%,
        rgba(0,0,0,0)
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,1) 40%,
        rgba(0,0,0,0)
      );

      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;

      animation: fadeDrift 14s ease-in forwards;
    }

    @keyframes fadeDrift {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(8px);
      }
    }

    .links {
      margin-top: 100px;
      opacity: 0.5;
    }

    a {
      color: #9aa4ff;
      text-decoration: none;
    }
  </style>
</head>

<body>
<div class="cursor-dot"></div>
<div class="cursor-outline"></div>
  
<div class="page">

  <h2>it gets quieter</h2>

  <div class="thought slow">
    I should probably… think about what I need to do tomorrow…
  </div>

  <div class="thought slow">
    maybe I’ll just close my eyes for a second…
  </div>

  <div class="thought fade-out">
    just a second is fine…
  </div>

  <div class="thought fade-out">
    ...
  </div>

  <div class="links">
    <p><a href="index.html">→ wake up</a></p>
  </div>

</div>

<script src="assets/js/main.js"></script>
  
</body>
</html>
