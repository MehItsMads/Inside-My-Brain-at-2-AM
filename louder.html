<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>It Gets Louder</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    body {
      color: #e6e6e6;
      font-family: system-ui, sans-serif;
      overflow-x: hidden;
    }
    
    .container {
      max-width: 700px;
    }

    h2 {
      margin-top: 80px;
      opacity: 0.9;
    }

    .thought {
      margin: 40px 0;
      font-size: 1.05rem;
      opacity: 0.25;
      transition: 0.3s ease;
    }

    .thought:nth-child(odd) {
      opacity: 0.4;
    }

    .thought.louder {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .pulse {
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    .links {
      margin: 80px 0;
    }

    a {
      color: #aab3ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="container text-center">

  <h2 class="pulse">it gets louder</h2>

  <div class="thought">Did I forget something today?</div>
  <div class="thought louder">What if something goes wrong tomorrow?</div>
  <div class="thought">Why did I say that earlier?</div>

  <div class="thought louder">
    it repeats in the background of everything
  </div>

  <div class="thought">I try to stop it</div>
  <div class="thought louder">but it doesn’t slow down</div>

  <div class="links">
    <p><a href="quieting.html">← it gets quieter</a></p>
    <p><a href="index.html">→ start over</a></p>
  </div>

</div>

</body>
</html>
