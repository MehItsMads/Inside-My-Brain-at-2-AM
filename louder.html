<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>It Gets Louder</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #07070a;
      color: #e6e6e6;
      font-family: system-ui, sans-serif;
      overflow-x: hidden;
    }

    .container {
      max-width: 700px;
    }

    h2 {
      margin-top: 80px;
      opacity: 0.9;
    }

    .thought {
      margin: 40px 0;
      font-size: 1.05rem;
      opacity: 0.25;
      transition: 0.3s ease;
    }

    .thought:nth-child(odd) {
      opacity: 0.4;
    }

    .thought.louder {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .pulse {
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    .links {
      margin: 80px 0;
    }

    a {
      color: #aab3ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
